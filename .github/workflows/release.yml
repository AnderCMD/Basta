name: Release APK

# Al subir una etiqueta vX.Y.Z se compila el APK de Android y se publica en
# GitHub Releases para descargarlo directo. También se puede lanzar a mano.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta existente (ej. v1.0.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Tipos, lint y pruebas
        run: npm run check

      - name: Versión de package.json = etiqueta
        run: |
          v="v$(node -p "require('./package.json').version")"
          if [ "$v" != "$TAG" ]; then echo "package.json dice $v pero la etiqueta es $TAG"; exit 1; fi

      - name: Generar proyecto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk "basta-$TAG.apk"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notas: la sección de esta versión en CHANGELOG.md.
          awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo ""
            echo "### Instalar"
            echo "Descarga **basta-$TAG.apk** en tu Android y ábrelo (permite instalar apps de origen desconocido)."
          } >> notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "basta-$TAG.apk" --clobber
          else
            gh release create "$TAG" "basta-$TAG.apk" --title "Basta $TAG" --notes-file notes.md --latest
          fi
